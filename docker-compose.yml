services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=recruitment_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitment_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.11
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - resume-data:/app/storage
      - recruit-data:/app/data
    environment:
      - LLM_PROVIDER=mock
      - DATABASE_URL=sqlite:////app/data/recruit.db
      - POSTGRES_DB=recruitment_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=http://localhost:3000
      - UPLOAD_DIR=./uploads
      - V2_STORAGE_DIR=/app/storage
      - MAX_FILE_SIZE_MB=10
      - RESUME_CLEANUP_ENABLED=${RESUME_CLEANUP_ENABLED:-true}
      - RESUME_UNBOUND_RETENTION_HOURS=${RESUME_UNBOUND_RETENTION_HOURS:-24}
      - RESUME_CLEANUP_INTERVAL_MINUTES=${RESUME_CLEANUP_INTERVAL_MINUTES:-60}
      - RESUME_CLEANUP_BATCH_SIZE=${RESUME_CLEANUP_BATCH_SIZE:-50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chroma:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  recruit-data:
  resume-data:
  postgres-data:
  redis-data:
  chroma-data:
